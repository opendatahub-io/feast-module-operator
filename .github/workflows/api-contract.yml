name: API contract

# API contract compatibility checks for the FeastOperator CRD
# (components.platform.opendatahub.io).
#
# Reusable workflows come from red-hat-data-services/api-contract-tests, pinned to
# the floating release tag `latest` (v2.2.0 when this file was added). It moves with
# every release. Read the release notes and
# https://github.com/red-hat-data-services/api-contract-tests/blob/main/docs/releasing.md
# before changing the pin.
#
# Baseline: 51114301a748ce5bf27f43228b7a819d9b929fcc, the commit of this repository
# that the newest GA release tag ships: opendatahub-io/opendatahub-operator tag
# v3.6.0 (2026-11-03) pins it as `main@51114301...` in manifests-config.yaml.
# This repository has no release tags of its own (checked on 2026-11-16).
# Everything in the CRD at that commit must stay compatible. Moving the baseline
# needs approval from someone other than the author of the change.
#
# There is no .rhoai/contracts.yaml: this repository has no OpenAPI documents, so
# the coverage job runs in CRD-only mode.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  crd-contract:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      # The canonical CRD manifest (FeastOperator).
      crd-glob: config/crd/bases/*.yaml
      baseline-refs: 51114301a748ce5bf27f43228b7a819d9b929fcc  # pinned by opendatahub-operator tag v3.6.0
      mode: enforce

  api-contract-coverage:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      crd-globs: config/crd/bases/*.yaml
      # CRD manifests deliberately not checked here:
      # - config/chart/crds/*.yaml: differently rendered copy of the canonical CRD
      #   above (generated by `make helm`)
      # - config/manifests/feastoperator/crd/bases/*.yaml: CRD of another project
      #   (group feast.dev, owned by opendatahub-io/feast), bundled here for deployment
      crd-exclude-globs: >-
        config/chart/crds/*.yaml
        config/manifests/feastoperator/crd/bases/*.yaml
      baseline-refs: 51114301a748ce5bf27f43228b7a819d9b929fcc  # pinned by opendatahub-operator tag v3.6.0
      yq-version: "4.45.1"
      mode: enforce
