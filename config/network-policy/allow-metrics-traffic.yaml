# Module-bundle NetworkPolicy for the feast-module-operator controller pod.
# Lifecycle: rendered by opendatahub-operator with the module bundle; the
# module controller MUST NOT reconcile this object.
#
# Ingress: allows metrics scraping (TCP 8443) from namespaces labeled
# "metrics: enabled" (e.g. openshift-monitoring).
#
# Health probes (TCP 8081) are kubelet-sourced and bypass NetworkPolicy
# enforcement on supported platforms (OpenShift with OVN-Kubernetes).
# No broad ingress rule is added for this path per ADR NG7 / policy
# content requirements.  Complementary protection: the health endpoints
# (/healthz, /readyz) are unauthenticated read-only status checks with
# no side effects.
#
# Ref: ODH-ADR-Operator-0016 §Module-bundle policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-feast-operator
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendatahub-feast-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              metrics: enabled
      ports:
        - port: 8443
          protocol: TCP
